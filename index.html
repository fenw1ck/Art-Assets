 Object.keys(ITEMART.D).filter(k=>!['parcel','ax','chest','coins'].includes(k)).forEach(k=>(V[k]||[k]).forEach(id=>add('item-'+id.replace(':','-'),nameOf(id),'Items','items.js','ITEMART.draw',/^(potato|produce|dish)$/.test(k)?['food','items']:k==='weapon'?['weapons','items']:/^(firewood|kindling|cauldron)$/.test(k)?['cooking-fire','items']:k==='health'?['health-potion','potions','items']:[k,'items'],

if(window.KITCHEN){[['stove','Kitchen range (stove and oven)',(c,S)=>KITCHEN.stove(c,S/2,S*.95,S*.42,1,{t:1})],['table','Kitchen table',(c,S)=>KITCHEN.table(c,S/2,S*.85,S*.5,1)],['island','Kitchen island',(c,S)=>KITCHEN.island(c,S/2,S*.92,S*.45,2,{rack:true})],['shelf','Kitchen shelf',(c,S)=>KITCHEN.shelf(c,S/2,S*.55,S*.7,1)]].forEach(([k,n,d])=>add('kitchen-'+k,n,'Kitchen','kitchen.js','KITCHEN.'+k,['kitchen'],d));

/* research: entries by id and alias */
let LIB=[];/* ---------- how the art is organised (25 Nov 2026; README "How the art is organised") ----------
   Two things, the way asset libraries and libraries of books do it:
   1. One BRANCH: where a piece lives, like a taxonomy or the Dewey system. It is the research tree: the top level is the
      kind of thing (Living things, Made things, Materials, Patterns and surfaces), then each entry's parents, down to the
      piece. A piece with no research entry of its own hangs under its nearest entry (or under its category's branch).
   2. FACETS: tags in named groups, so a piece can be found by any trait (faceted classification): where it is used
      (indoor / outdoor / both), its use (consumable, permanent, wardrobe, environment, tool, container, currency),
      the rooms it appears in, what it is made of, and the projects that use it.
   Facets come from the category below, with per-piece changes in TAGS_BY. */
const TOP={subject:'Living things',object:'Made things',material:'Materials',pattern:'Patterns and surfaces',technique:'How to draw'};
const FACETS=[['setting','Where'],['use','Use'],['room','Rooms'],['material','Made of'],['project','Projects']];
const TAGS_CAT={
 Plants:{setting:['both'],use:['environment','harvest'],room:['greenhouse','garden'],material:['plant'],project:['Euclid game','Planting Guide']},
 Containers:{setting:['both'],use:['container','permanent'],room:['corridor','library','bedroom','greenhouse'],material:['wood','metal'],project:['Euclid game']},
 Tools:{setting:['both'],use:['tool','permanent'],room:['front doors'],material:['metal','wood'],project:['Euclid game']},
 Vines:{setting:['both'],use:['environment'],room:['front doors','corridor','library','bedroom','greenhouse'],material:['plant'],project:['Euclid game']},
 Furniture:{setting:['indoor'],use:['environment'],room:['library'],material:['wood','fabric'],project:['Euclid game']},
 Bedroom:{setting:['indoor'],use:['environment'],room:['bedroom'],material:['wood','fabric'],project:['Euclid game']},
 Floors:{setting:['indoor'],use:['environment'],room:['corridor','library','bedroom'],material:['stone'],project:['Euclid game']},
 Garden:{setting:['outdoor'],use:['environment'],room:['garden'],material:['stone','metal'],project:['Euclid game']},
 Creatures:{setting:['both'],use:['enemy'],room:['corridor','library','bedroom','greenhouse'],material:['creature'],project:['Euclid game']},
 Kitchen:{setting:['indoor'],use:['cooking','environment'],room:['kitchen'],material:['wood','metal'],project:['Euclid game']},
 Traps:{setting:['indoor'],use:['trap','environment'],room:['corridor','library','bedroom'],material:['metal','stone'],project:['Euclid game']},
 Items:{setting:['both'],use:['permanent'],room:['corridor','library','bedroom','greenhouse'],material:['metal'],project:['Euclid game']}};
const TAGS_BY=[ /* [test on the piece id, changes] */
 [/^plant-(pothos|snake_plant|monstera|peace_lily|spider_plant)/,{setting:['indoor'],use:['environment'],room:['bedroom','library']}],
 [/^plant-(apple|pear|peach|fig)/,{setting:['outdoor'],room:['garden']}],
 [/^floor-wood/,{material:['wood']}],[/^floor-carpet/,{material:['fabric']}],
 [/^nightlight|^mobile/,{material:['glass','metal']}],[/^side-table/,{material:['wood','glass']}],
 [/^item-scroll/,{use:['consumable'],room:['library','corridor','bedroom'],material:['paper']}],
 [/^item-(boots|cape|gloves|shirt|pants|crown|necklace|ring)/,{use:['wardrobe'],room:['bedroom','corridor'],material:['fabric']}],
 [/^item-boots/,{material:['leather','metal']}],[/^item-(crown|necklace|ring)/,{material:['metal']}],
 [/^item-potion/,{use:['consumable'],room:['greenhouse','corridor'],material:['glass']}],
 [/^item-health/,{use:['consumable'],room:['corridor','bedroom','library','kitchen','greenhouse'],material:['glass','metal']}],[/^item-backpack/,{use:['permanent'],room:[],material:['leather','fabric']}],
 [/^item-coin/,{use:['currency'],material:['metal']}],
 [/^item-potato|^item-produce/,{use:['consumable','harvest'],room:['greenhouse'],material:['food']}],
 [/^item-weapon/,{use:['weapon','consumable'],material:['metal','wood']}],[/^item-(firewood|kindling)/,{use:['fuel','consumable'],room:['greenhouse','front doors'],material:['wood']}],[/^item-cauldron/,{use:['cooking','permanent'],room:['greenhouse'],material:['metal']}],
 [/^item-(dish|cooked|burnt)/,{use:['consumable'],room:['kitchen','greenhouse'],material:['food']}],[/^campfire/,{setting:['both'],room:['greenhouse'],material:['stone','wood']}],
 [/^item-soil/,{use:['consumable'],room:['greenhouse'],material:['soil']}],
 [/^item-(tile|amphora|bust)/,{material:['stone']}],[/^item-(map)/,{material:['paper']}],[/^item-(lyre|straightedge)/,{material:['wood']}],[/^item-hourglass/,{material:['glass','wood']}],
 [/^item-sword|^item-compass|^item-astrolabe|^item-chalice|^item-lamp/,{material:['metal']}]];
const CATPATH={Creatures:['Living things','Creatures of myth'],Kitchen:['Made things','Furniture','Kitchen'],Traps:['Made things','Traps'],Garden:['Made things','Garden features'],Bedroom:['Made things','Furniture'],Items:['Made things','Items'],Floors:['Patterns and surfaces','Floors'],Tools:['Made things','Tools'],Vines:['Living things','Plants'],Plants:['Living things','Plants'],Furniture:['Made things','Furniture'],Containers:['Made things','Containers']};
function tagsOf(a){if(a._tags)return a._tags;const t=JSON.parse(JSON.stringify(TAGS_CAT[a.cat]||{}));for(const[re,ch]of TAGS_BY)if(re.test(a.id))Object.assign(t,ch);
 /* Ingredient: food that must be cooked (in an oven or a cauldron) before it can be eaten: PLANTS.harvest says which */
 const m=a.id.match(/^item-(produce-(.+)|potato-(red|purple|brown))$/);if(m&&window.PLANTS){const H=PLANTS.harvest(PLANTS.byId[m[2]||'potato']);if(H&&H.ingredient)t.use=['ingredient','harvest'];else if(H&&!H.food){t.use=['harvest','permanent'];t.material=['plant']}}
 return a._tags=t}
const tagList=a=>{const t=tagsOf(a);return FACETS.flatMap(([k])=>(t[k]||[]).map(v=>[k,v]))};
/* the research chain, root first */
function chainOf(e){const out=[];let x=e;const seen=new Set();while(x&&!seen.has(x.id)){seen.add(x.id);out.unshift(x);x=x.parent&&x.parent!=='none'?LIB.find(y=>y.id===x.parent):null}return out}
const ownEntry=a=>{const r=a.res[0];return LIB.find(e=>e.id===r||(e.aliases||[]).includes(r))||null};
function branchOf(a){const e=entryFor(a);if(!e)return[...(CATPATH[a.cat]||[a.cat]),a.name];const ch=chainOf(e),top=TOP[ch[0].kind]||ch[0].kind,names=ch.map(x=>x.title.replace(/ \(.*\)$/,''));
  const p=[top,...names];if(a.cat==='Garden'||(a.cat==='Bedroom'&&!ownEntry(a)&&!/^bed-|^nightstand/.test(a.id)))return[...(CATPATH[a.cat]||[]),a.name];
  if(!ownEntry(a)||e.title.toLowerCase()!==a.name.toLowerCase())p.push(a.name);return p}
const entryFor=a=>{for(const r of a.res){const e=LIB.find(e=>e.id===r)||LIB.find(e=>(e.aliases||[]).includes(r));if(e)return e}return null};
function paint(cv,a,S){const c=cv.getContext('2d');c.clearRect(0,0,S,S);try{a.draw(c,S)}catch(e){c.fillStyle='#a33';c.font='12px system-ui';c.fillText('Could not draw: '+e.message,8,20)}}
let cat='All';const CATS=['All',...new Set(A.map(a=>a.cat))];
function renderCats(){$('cats').innerHTML=CATS.map(c=>`<button type="button" aria-pressed="${c===cat}">${esc(c)}</button>`).join('');$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.textContent;renderCats();render()})}
function matches(a,q){if(cat!=='All'&&a.cat!==cat)return false;if(!q)return true;
 const m=q.match(/^(in|setting|use|room|material|project):(.+)$/);if(m){const v=m[2].trim();if(m[1]==='in')return LIB.length&&branchOf(a).some(b=>b.toLowerCase()===v);return(tagsOf(a)[m[1]]||[]).some(x=>x.toLowerCase()===v)}
 const e=entryFor(a);return[a.name,a.cat,a.file,a.fn,a.id,...a.res,e&&e.title,...((e&&e.aliases)||[]),...tagList(a).map(x=>x[1]),...(LIB.length?branchOf(a):[])].join(' ').toLowerCase().includes(q)}
function setQ(v){$('q').value=v;cat='All';renderCats();render();if(ORG)renderOrg();scrollTo(0,0)}
function render(){const q=$('q').value.toLowerCase().trim(),L=A.filter(a=>matches(a,q));$('n').textContent=`${L.length} of ${A.length}`;
 $('grid').innerHTML=L.map(a=>`<button type="button" class="card" data-id="${esc(a.id)}"><canvas width="240" height="240"></canvas><b>${esc(a.name)}</b><small>${esc(a.cat)}</small></button>`).join('')||'<p>Nothing matches. <a href="'+RB+'">Make it as new art</a>.</p>';
 const cards=[...$('grid').querySelectorAll('.card')];cards.forEach(b=>b.onclick=()=>openCard(b.dataset.id));
 let i=0;(function step(){const t=performance.now();while(i<cards.length&&performance.now()-t<30){const b=cards[i++];paint(b.querySelector('canvas'),A.find(a=>a.id===b.dataset.id),240)}if(i<cards.length)requestAnimationFrame(step)})()}
function openCard(id){const a=A.find(x=>x.id===id);if(!a)return;paint($('big'),a,600);const e=entryFor(a),own=ownEntry(a),br=branchOf(a),T=tagsOf(a);history.replaceState(null,'','#'+id);
 $('det').innerHTML=`<h2>${esc(a.name)}</h2><p class="branch" aria-label="Where it lives">${br.map((b,i)=>`<button type="button" data-q="in:${esc(b)}">${esc(b)}</button>`).join('<span>›</span>')}</p>
  <dl><dt>Drawn by</dt><dd><a href="${GH+a.file}">${esc(a.file)}</a> · <code>${esc(a.fn)}</code></dd>
  ${FACETS.map(([k,l])=>(T[k]||[]).length?`<dt>${esc(l)}</dt><dd class="tags">${T[k].map(v=>`<button type="button" data-q="${k}:${esc(v)}">${esc(v)}</button>`).join('')}</dd>`:'').join('')}
  ${e?`<dt>Research</dt><dd><a href="${GH+e.file}">${esc(e.title)}</a> (${esc(e.depth)})${own?'':' <small>(its nearest entry: this piece has none of its own yet)</small>'}</dd><dt>Also called</dt><dd>${esc((e.aliases||[]).join(', ')||'—')}</dd><dt>Gaps</dt><dd>${esc((e.gaps||[]).join(', ')||'none listed')}</dd>`:`<dt>Research</dt><dd>no entry yet</dd>`}</dl>
  <div class="acts"><button type="button" class="btn" id="edit">Edit this art</button><button type="button" class="btn ghost" id="close">Close</button></div>
  <p style="color:var(--sub);font-size:13px">Edit opens the Request Builder with an "Improve" ticket for this art: this picture, where it lives, its tags and its research entry go with it. Tap a tag or a branch to see everything filed there.</p>`;
 $('info').style.display='flex';$("close").onclick=closeCard;$('det').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{closeCard();setQ(b.dataset.q)});
 $('edit').onclick=()=>{const t=document.createElement('canvas');t.width=t.height=320;t.getContext('2d').fillStyle='#f1ece2';t.getContext('2d').fillRect(0,0,320,320);paint2(t,a);
  const q=new URLSearchParams({improve:own?own.id:a.id,title:a.name,from:SITE+'#'+a.id,branch:br.join(' › '),tags:tagList(a).map(([k,v])=>k+':'+v).join('; '),drawn:a.file+' '+a.fn});
  if(own)q.set('entry',own.id);else if(e)q.set('parent',e.id);
  location.href=`${RB}?${q}#img=${encodeURIComponent(t.toDataURL('image/png'))}`}}
function paint2(cv,a){const c=cv.getContext('2d');try{a.draw(c,cv.width)}catch(e){}}
function closeCard(){$('info').style.display='none';history.replaceState(null,'',location.pathname)}
$('info').onclick=e=>{if(e.target===$("info"))closeCard()};addEventListener('keydown',e=>{if(e.key==="Escape")closeCard()});
$('q').addEventListener('input',render);
/* "How it's organised": the branches (the research tree, with how many pieces live under each) and the facets */
let ORG=false;$('orgb').onclick=()=>{ORG=!ORG;$('orgb').setAttribute('aria-expanded',ORG);$('org').hidden=!ORG;if(ORG)renderOrg()};
function renderOrg(){const tree={};A.forEach(a=>{let n=tree;for(const b of branchOf(a)){n[b]=n[b]||{_n:0};n[b]._n++;n=n[b]}});
 const walk=(n,d)=>Object.keys(n).filter(k=>k!=='_n'&&Object.keys(n[k]).length>1).sort().map(k=>{const kids=Object.keys(n[k]).filter(x=>x!=='_n').length;return`<li><button type="button" data-q="in:${esc(k)}">${esc(k)}</button> <small>${n[k]._n}</small>${kids&&d<3?`<ul>${walk(n[k],d+1)}</ul>`:''}</li>`}).join('');
 const counts=k=>{const c={};A.forEach(a=>(tagsOf(a)[k]||[]).forEach(v=>c[v]=(c[v]||0)+1));return Object.entries(c).sort((x,y)=>y[1]-x[1])};
 $('org').innerHTML=`<div class="orgcol"><h2>Where it lives: one branch each</h2><p>Like a taxonomy or the Dewey system: every piece has one place, found by kind of thing, then family, then the piece. The branches are the research library's tree (research/), so the art sits beside what is known about it. A piece with no research entry of its own hangs under its nearest one. Tap a branch to see the pieces in it.</p><ul class="tree">${walk(tree,0)}</ul></div>
  <div class="orgcol"><h2>Tags: find it by any trait</h2><p>Facets cut across the branches, the way game asset stores add tags to categories: a piece carries a tag in each group, and any tag lists everything that shares it.</p>${FACETS.map(([k,l])=>`<h3>${esc(l)}</h3><p class="tags">${counts(k).map(([v,n])=>`<button type="button" data-q="${k}:${esc(v)}">${esc(v)} <small>${n}</small></button>`).join('')}</p>`).join('')}
  <p class="note">Filter by typing too: <code>room:greenhouse</code>, <code>use:consumable</code>, <code>material:glass</code>, <code>in:Nightshade family</code>. Rules for adding a piece: README, "How the art is organised".</p></div>`;
 $('org').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setQ(b.dataset.q))}
renderCats();render();
fetch('research/index.json').then(r=>r.json()).then(d=>{LIB=d;if(location.hash.length>1)openCard(decodeURIComponent(location.hash.slice(1)))}).catch(()=>{if(location.hash.length>1)openCard(location.hash.slice(1))});
</script>
</body></html>
