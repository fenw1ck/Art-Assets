<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Assets: the library</title>
<style>
:root{--bg:#f7f8f7;--ink:#18211f;--sub:#5b6663;--line:#d9dfdd;--acc:#1d7380}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{padding:20px 20px 8px;max-width:1200px;margin:0 auto}h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1200px;margin:0 auto;padding:10px 20px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
#q{flex:1;min-width:220px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;border:0;font-size:15px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.cats{display:flex;flex-wrap:wrap;gap:6px;width:100%}.cats button{font:inherit;font-size:14px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer}.cats button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
#n{color:var(--sub);font-size:14px}
main{max-width:1200px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}.card:hover,.card:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px rgba(29,115,128,.25)}
.card canvas{width:100%;aspect-ratio:1;display:block;background:#f1ece2;border-radius:8px}.card b{display:block;font-size:14px;margin-top:6px}.card small{color:var(--sub)}
#info{position:fixed;inset:0;background:rgba(10,20,18,.45);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#info .box{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px}
@media(max-width:640px){#info .box{grid-template-columns:1fr}}
#info canvas{width:100%;aspect-ratio:1;background:#f1ece2;border-radius:10px}#info h2{margin:0 0 4px}#info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14px}#info dt{color:var(--sub)}#info dd{margin:0}
#info .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head><body>
<header><h1>Art Assets</h1><p>Every piece of art the projects can draw, drawn live from this repo's code. Tap one for its card and to edit it; new art starts in the Request Builder.</p></header>
<div class="bar"><input id="q" type="search" placeholder="Search: chest, tomato, ivy, bed…" aria-label="Search the art"><span id="n"></span>
 <a class="btn" href="https://fenw1ck.github.io/Claude-API-Optimization/">Make new art</a><div class="cats" id="cats"></div></div>
<main id="grid"></main>
<div id="info" role="dialog" aria-modal="true"><div class="box"><canvas id="big" width="600" height="600"></canvas><div id="det"></div></div></div>
<script src="core.js"></script><script src="plants.js"></script><script src="containers.js"></script><script src="tools.js"></script><script src="vines.js"></script>
<script src="furniture.js"></script><script src="floors.js"></script><script src="bedroom.js"></script><script src="garden.js"></script><script src="items.js" onerror="this.remove()"></script>
<script>
/* The library (25 Nov 2026): one card per piece of art the modules can draw. Each card knows its file, function and
   research entry; "Edit this art" opens the Request Builder with an improve ticket and this picture attached. */
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RB='https://fenw1ck.github.io/Claude-API-Optimization/',SITE='https://fenw1ck.github.io/Art-Assets/',GH='https://github.com/fenw1ck/Art-Assets/blob/main/';
const A=[],add=(id,name,cat,file,fn,res,draw)=>A.push({id,name,cat,file,fn,res,draw});
const fitImg=(ctx,img,S)=>{const k=Math.min(S*.9/img.width,S*.9/img.height);ctx.drawImage(img,(S-img.width*k)/2,(S-img.height*k)/2,img.width*k,img.height*k)};
if(window.PLANTS)PLANTS.list.forEach(p=>add('plant-'+p.id,p.common_name,'Plants','plants.js','PLANTS.drawFit',[p.id.split('_')[0],'plants'],(c,S)=>PLANTS.drawFit(c,p,S/2,S*.92,S*.8,'mature',7)));
if(window.CONTAINERS)['closed','open'].forEach(st=>add('chest-'+st,'Chest ('+st+')','Containers','containers.js','CONTAINERS.drawChest',['chest'],(c,S)=>CONTAINERS.drawChest(c,CONTAINERS.defaults,S/2,S*.8,S*.62,st,7,{})));
if(window.TOOLS)TOOLS.AXES.forEach((a,i)=>add('ax-'+i,a.name,'Tools','tools.js','TOOLS.drawAx',['axe','tools'],(c,S)=>TOOLS.drawAx(c,i,S*.42,S*.95,S*.88,0)));
if(window.VINES)VINES.LIST.forEach((k,i)=>add('vine-'+k,k.replace(/-/g,' ').replace(/^./,m=>m.toUpperCase()),'Vines','vines.js','VINES.render',[k],(c,S)=>{c.save();c.translate(S*.27,S*.04);VINES.render(c,k,S*.46,S*.92,{seed:i+1});c.restore()}));
if(window.FURNITURE){add('bookshelf','Bookshelf','Furniture','furniture.js','FURNITURE.bookshelf',['furniture'],(c,S)=>fitImg(c,FURNITURE.bookshelf(S*.5,S*.9,1),S));
 add('armchair','Armchair','Furniture','furniture.js','FURNITURE.armchair',['furniture'],(c,S)=>FURNITURE.armchair(c,S/2,S*.85,S*.5,1,{view:'front'}));
 add('side-table','Side table with lamp','Furniture','furniture.js','FURNITURE.sideTable',['furniture'],(c,S)=>FURNITURE.sideTable(c,S/2,S*.9,S*.5,1,{lamp:true}))}
if(window.BEDROOM){BEDROOM.BEDS.forEach((t,i)=>add('bed-'+t,'Bed: '+t.replace(/-/g,' '),'Bedroom','bedroom.js','BEDROOM.bed',['bed'],(c,S)=>BEDROOM.bed(c,S/2,S*.85,S*.55,t,i+1,{view:'front'})));
 add('nightstand','Nightstand','Bedroom','bedroom.js','BEDROOM.nightstand',['nightstand'],(c,S)=>BEDROOM.nightstand(c,S/2,S*.92,S*.85,1,{light:'cylinder',t:1}));
 BEDROOM.LIGHTS.forEach(l=>add('nightlight-'+l,'Nightlight: '+l,'Bedroom','bedroom.js','BEDROOM.nightlight',['nightstand'],(c,S)=>BEDROOM.nightlight(c,S/2,S*.85,S*2.6,l,1)));
 BEDROOM.MOBILES.forEach((m,i)=>add('mobile-'+m,'Mobile: '+m,'Bedroom','bedroom.js','BEDROOM.mobile',['bed'],(c,S)=>BEDROOM.mobile(c,S/2,S*.02,S*1.05,m,i+1,1)))}
if(window.FLOORS)[['stone','Stone floor','stone-floor'],['wood','Wood floor','wood-floor'],['carpet','Carpet','carpet']].forEach(([k,n,r])=>add('floor-'+k,n,'Floors','floors.js','FLOORS.'+k,[r],(c,S)=>fitImg(c,FLOORS[k](3,3,60,1),S)));
if(window.GARDEN)[['fountain','Fountain'],['lantern','Lantern'],['pedestal','Pedestal'],['gate','Gate']].forEach(([k,n])=>add('garden-'+k,n,'Garden','garden.js','GARDEN.'+k,['plants'],(c,S)=>GARDEN[k](c,S/2,S/2,S*(k==='lantern'?.7:.28),1)));
if(window.ITEMART){const V={boots:['boots-sandals','boots-wayfarer','boots-winged','boots-greaves'],potion:['potion-weak','potion-strong','potion-strongest'],coin:['coin-gold','coin-silver','coin-bronze'],scroll:['scroll-circles','scroll-lines'],potato:['potato-red','potato-purple','potato-brown','potato-baked'],produce:['produce-tomato_cherry','produce-carrot','produce-lettuce','produce-sunflower']};
 Object.keys(ITEMART.D).filter(k=>!['parcel','ax','chest','coins'].includes(k)).forEach(k=>(V[k]||[k]).forEach(id=>add('item-'+id,id.replace(/-/g,' ').replace(/^./,m=>m.toUpperCase()),'Items','items.js','ITEMART.draw',[k,'items'],
  (c,S)=>id.startsWith('coin-')?ITEMART.coin(c,S/2,S/2,S*.36,{metal:id.slice(5)}):ITEMART.draw(c,id,S/2,S*.9,S*.8,{seed:3}))))}
/* research: entries by id and alias */
let LIB=[];const entryFor=a=>{for(const r of a.res){const e=LIB.find(e=>e.id===r)||LIB.find(e=>(e.aliases||[]).includes(r));if(e)return e}return null};
function paint(cv,a,S){const c=cv.getContext('2d');c.clearRect(0,0,S,S);try{a.draw(c,S)}catch(e){c.fillStyle='#a33';c.font='12px system-ui';c.fillText('Could not draw: '+e.message,8,20)}}
let cat='All';const CATS=['All',...new Set(A.map(a=>a.cat))];
function renderCats(){$('cats').innerHTML=CATS.map(c=>`<button type="button" aria-pressed="${c===cat}">${esc(c)}</button>`).join('');$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.textContent;renderCats();render()})}
function matches(a,q){if(cat!=='All'&&a.cat!==cat)return false;if(!q)return true;const e=entryFor(a);return[a.name,a.cat,a.file,a.fn,a.id,...a.res,e&&e.title,...((e&&e.aliases)||[])].join(' ').toLowerCase().includes(q)}
function render(){const q=$('q').value.toLowerCase().trim(),L=A.filter(a=>matches(a,q));$('n').textContent=`${L.length} of ${A.length}`;
 $('grid').innerHTML=L.map(a=>`<button type="button" class="card" data-id="${esc(a.id)}"><canvas width="240" height="240"></canvas><b>${esc(a.name)}</b><small>${esc(a.cat)}</small></button>`).join('')||'<p>Nothing matches. <a href="'+RB+'">Make it as new art</a>.</p>';
 const cards=[...$('grid').querySelectorAll('.card')];cards.forEach(b=>b.onclick=()=>openCard(b.dataset.id));
 let i=0;(function step(){const t=performance.now();while(i<cards.length&&performance.now()-t<30){const b=cards[i++];paint(b.querySelector('canvas'),A.find(a=>a.id===b.dataset.id),240)}if(i<cards.length)requestAnimationFrame(step)})()}
function openCard(id){const a=A.find(x=>x.id===id);if(!a)return;paint($('big'),a,600);const e=entryFor(a);history.replaceState(null,'','#'+id);
 $('det').innerHTML=`<h2>${esc(a.name)}</h2><dl><dt>Category</dt><dd>${esc(a.cat)}</dd><dt>Drawn by</dt><dd><a href="${GH+a.file}">${esc(a.file)}</a> · <code>${esc(a.fn)}</code></dd>
  ${e?`<dt>Research</dt><dd><a href="${GH+e.file}">${esc(e.title)}</a> (${esc(e.depth)})</dd><dt>Also called</dt><dd>${esc((e.aliases||[]).join(', ')||'—')}</dd><dt>Gaps</dt><dd>${esc((e.gaps||[]).join(', ')||'none listed')}</dd><dt>Used by</dt><dd>${esc((e.used_by||[]).join(', ')||'—')}</dd>`:`<dt>Research</dt><dd>no entry yet</dd>`}</dl>
  <div class="acts"><button type="button" class="btn" id="edit">Edit this art</button><button type="button" class="btn ghost" id="close">Close</button></div>
  <p style="color:var(--sub);font-size:13px">Edit opens the Request Builder with an "Improve" ticket for this art, this picture attached to it.</p>`;
 $('info').style.display='flex';$("close").onclick=closeCard;
 $('edit').onclick=()=>{const t=document.createElement('canvas');t.width=t.height=320;t.getContext('2d').fillStyle='#f1ece2';t.getContext('2d').fillRect(0,0,320,320);paint2(t,a);
  location.href=`${RB}?improve=${encodeURIComponent(e?e.id:a.id)}&title=${encodeURIComponent(a.name)}&from=${encodeURIComponent(SITE+'#'+a.id)}#img=${encodeURIComponent(t.toDataURL('image/png'))}`}}
function paint2(cv,a){const c=cv.getContext('2d');try{a.draw(c,cv.width)}catch(e){}}
function closeCard(){$('info').style.display='none';history.replaceState(null,'',location.pathname)}
$('info').onclick=e=>{if(e.target===$("info"))closeCard()};addEventListener('keydown',e=>{if(e.key==="Escape")closeCard()});
$('q').addEventListener('input',render);
renderCats();render();
fetch('research/index.json').then(r=>r.json()).then(d=>{LIB=d;if(location.hash.length>1)openCard(decodeURIComponent(location.hash.slice(1)))}).catch(()=>{if(location.hash.length>1)openCard(location.hash.slice(1))});
</script>
</body></html>
