  ctx.save();ctx.translate(pad+4*cw*.62+200,y1+14);door(0,0,180,390);V.render(ctx,'virginia-creeper',180,390,{seed:4,bloom:'fruit'});ctx.restore();
}else{ /* core.js: ramps, noise, warp, a marble test and Voronoi stones */
  const A=ART_CORE,S=180,pad=24;c.width=pad+4*(S+pad);c.height=760;ctx.fillStyle=BG;ctx.fillRect(0,0,c.width,c.height);
  label('ramp(base, 7): hue-shifted, dark to light; base in the middle',pad,20,INK,'bold 12px system-ui');
  ['#3f7f3a','#e0483b','#c9a25a','#8a6ac8','#b0b4b8'].forEach((b,j)=>{A.ramp(b,7).forEach((col,i)=>{ctx.fillStyle=col;ctx.fillRect(pad+i*44,30+j*30,40,24)});label(b,pad+7*44+8,46+j*30,SUB)});
  const field=(x0,y0,f,title)=>{const im=ctx.createImageData(S,S);for(let y=0;y<S;y++)for(let x=0;x<S;x++){const v=f(x,y),k=(y*S+x)*4;
      const col=Array.isArray(v)?v:[v*255,v*255,v*255];im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=255}ctx.putImageData(im,x0,y0);label(title,x0,y0+S+14,SUB)};
  const y1=210;
  field(pad,y1,(x,y)=>A.noise(x/24,y/24,3),'noise');
  field(pad+(S+pad),y1,(x,y)=>A.fbm(x/60,y/60,3),'fbm (5 octaves)');
  field(pad+2*(S+pad),y1,(x,y)=>A.warp(x/70,y/70,3),'warp (domain-warped fbm)');
  field(pad+3*(S+pad),y1,(x,y)=>{const v=A.voronoi(x,y,36,5);return v.edge<2?0:.35+.5*v.id},'voronoi cells and edges');
  const y2=y1+S+40,stone='#ece6dc',vein='#7d7a76';
  field(pad,y2,(x,y)=>{const b=Math.abs(Math.sin((x*.9+y*.35)/22+6*A.fbm(x/70,y/70,9))),t=Math.pow(1-b,14);return A.hex(A.mix(stone,vein,t*.9))},'marble: banding + warp');
  field(pad+(S+pad),y2,(x,y)=>{const v=A.voronoi(x,y,30,11),base=A.mix('#b8863e','#7a3a28',v.id),g=A.fbm(x/6,y/6,2)*.25;return v.edge<1.6?A.hex('#e8dcc4'):A.hex(A.mix(base,'#2a1a10',g))},'breccia: voronoi fragments');
  field(pad+2*(S+pad),y2,(x,y)=>{const g=A.noise(x/1.6,y/1.6,4)*.18+A.fbm(x/90,y/30,8)*.25,p=A.fbm(x/120,y/120,6);return A.hex(A.mix(A.mix('#e9d6a6','#c58f45',p),'#6b4a22',g))},'sandstone: grain, bedding, patina');
  field(pad+3*(S+pad),y2,(x,y)=>{const t=60,gx=x%t,gy=y%t,seam=gx<3||gy<3,v=A.fbm(x/40+Math.floor(x/t)*7,y/40,Math.floor(y/t)*3+Math.floor(x/t));
      if(seam)return A.hex(gx<1.5||gy<1.5?'#5b5148':'#8a7e70');return A.hex(A.mix('#d9cfc2','#a89a88',v))},'tiles + grout test');
}
document.title='done';
</script></body></html>
