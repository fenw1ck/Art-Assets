name: Botanical renderer data validation
on:
  push:
    paths:
      - '.github/workflows/plant-art-preview.yml'
      - 'tools/plant-art.py'
      - 'botanical-renderer.html'
      - 'plants.js'
      - 'plant-art/infocards.json'
      - 'research/subjects/plants/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-data-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency (validation only)
        run: python -m pip install Pillow
      - name: Validate Python syntax
        run: python -m py_compile tools/plant-art.py
      - name: Validate species construction profiles
        run: python tools/plant-art.py --check
      - name: Validate infocard population without rendering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cards = json.loads(Path("plant-art/infocards.json").read_text(encoding="utf-8"))
          assert len(cards) == 57, f"Expected 57 infocards, found {len(cards)}"
          assert len({card["id"] for card in cards}) == 57, "Duplicate plant IDs"
          assert min(card.get("populated_user_data_count", 0) for card in cards) >= 4
          for card in cards:
              research_path = card.get("research_record")
              assert research_path and Path(research_path).is_file(), f"Missing research record for {card['id']}: {research_path}"
              assert card.get("user_data_provenance"), f"Missing field provenance for {card['id']}"
          assert sum(bool(card.get("image")) for card in cards) == 8, "Unexpected image references; this job must not render"
          print(f"Validated {len(cards)} infocards and all linked research records; minimum populated user-data fields: {min(card['populated_user_data_count'] for card in cards)}")
          PY
