name: Plant art preview
on:
  push:
    paths:
      - '.github/workflows/plant-art-preview.yml'
      - 'tools/plant-art.py'
      - 'plants.js'
  workflow_dispatch:
jobs:
  render-first-eight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Validate species profiles
        run: python tools/plant-art.py --check
      - name: Render first eight plant infocards
        run: python tools/plant-art.py --only tomato_cherry tomato_indeterminate tomato_determinate pepper_bell eggplant corn_sweet bean_bush bean_pole
      - uses: actions/upload-artifact@v4
        with:
          name: fenwick-first-eight-plant-art
          path: plant-art/
          if-no-files-found: error
