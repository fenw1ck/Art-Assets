name: Plant art preview
on:
  push:
    paths:
      - '.github/workflows/plant-art-preview.yml'
      - 'tools/plant-art.py'
      - 'plants.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-flower-infocards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Validate all species profiles
        run: python tools/plant-art.py --check
      - name: Render eight flowering plant infocards in Python
        run: python tools/plant-art.py --only nasturtium calendula pansy sweet_pea cosmos zinnia petunia fuchsia --size 1024 --seed 7
      - name: Upload rendered infocards
        uses: actions/upload-artifact@v4
        with:
          name: fenwick-eight-flower-infocards
          path: plant-art/
          if-no-files-found: error
      - name: Commit generated flower assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant-art/
          if ! git diff --cached --quiet; then
            git commit -m "Add eight Python-rendered flower infocards"
            git push
          fi
