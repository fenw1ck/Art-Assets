name: Botanical renderer validation
on:
  push:
    paths:
      - '.github/workflows/plant-art-preview.yml'
      - 'tools/plant-art.py'
      - 'botanical-renderer.html'
      - 'plants.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Validate renderer syntax
        run: python -m py_compile tools/plant-art.py
      - name: Validate all species profiles
        run: python tools/plant-art.py --check
      - name: Test source-preserving duplicate
        run: python tools/plant-art.py --only nasturtium --source-image nasturtium=plant-art/nasturtium.png
      - name: Verify source and duplicate are byte-identical
        run: cmp plant-art/nasturtium.png plant-art/derived/source/nasturtium-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: botanical-renderer-source-preservation-test
          path: plant-art/derived/
          if-no-files-found: error
